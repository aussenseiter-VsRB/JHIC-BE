services:
  api:
    build: .
    container_name: jhic-be
    ports:
      - "${HOST_PORT:-8085}:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - B2_ENDPOINT=${B2_ENDPOINT:-s3.eu-central-003.backblazeb2.com}
      - B2_REGION=${B2_REGION:-eu-central-003}
      - B2_KEY_ID=${B2_KEY_ID}
      - B2_APP_KEY=${B2_APP_KEY}
      - B2_BUCKET=${B2_BUCKET:-jhic-berita-images}
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: jhic-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    profiles:
      - local

volumes:
  minio-data:
